---
name: Tests

on:
  push:
    tags-ignore:
      - '**'
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Build
      run: go build ./...

    - name: Test
      run: make test

    - name: Upload Code Coverage Profile
      uses: codecov/codecov-action@v7
      with:
        files: unit.coverprofile
        flags: unittests
        fail_ci_if_error: false
        verbose: false
